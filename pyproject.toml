[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vqe-gan"
version = "0.1.0"
description = "Reproducible experiments for differentiable quantum energy regularization in ACGANs"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy==2.2.6",
    "qiskit==1.4.6",
    "qiskit-algorithms==0.4.0",
    "qiskit-machine-learning==0.8.4",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[project.scripts]
vqe-gan-train = "vqe_gan.cli:main"
vqe-gan-evaluate = "vqe_gan.evaluation.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vqe_gan"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
